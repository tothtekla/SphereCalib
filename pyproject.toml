[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spherecalib"
version = "0.1.0"
description = "Sphere-based camera–LiDAR calibration and oriented silhouette research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.12", "opencv-python>=4.9"]

[project.scripts]
spherecalib = "spherecalib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
